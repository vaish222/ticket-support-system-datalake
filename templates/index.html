<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Ticket System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #1a202c;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 24px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #2d3748;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
    }

    .content {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
    }

    select {
      padding: 8px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }

    .tickets-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ticket-card {
      padding: 20px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ticket-card:hover {
      border-color: #667eea;
      background: #f7fafc;
      transform: translateX(4px);
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 8px;
    }

    .ticket-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 4px;
    }

    .ticket-meta {
      font-size: 13px;
      color: #718096;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-open { background: #c6f6d5; color: #22543d; }
    .status-in_progress { background: #bee3f8; color: #2c5282; }
    .status-resolved { background: #d6bcfa; color: #44337a; }
    .status-closed { background: #e2e8f0; color: #4a5568; }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      max-width: 800px;
      margin: 40px auto;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 20px 25px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
    }

    .close-btn {
      font-size: 28px;
      color: #a0aec0;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      line-height: 1;
    }

    .close-btn:hover {
      color: #4a5568;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #2d3748;
      margin-bottom: 8px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .messages-container {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 16px;
      background: #f7fafc;
      border-radius: 8px;
    }

    .message {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }

    .message:last-child {
      margin-bottom: 0;
    }

    .message-author {
      font-weight: 600;
      color: #667eea;
      margin-bottom: 4px;
    }

    .message-time {
      font-size: 12px;
      color: #a0aec0;
      margin-bottom: 8px;
    }

    .message-text {
      color: #2d3748;
      line-height: 1.6;
    }

    .status-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 16px;
      background: #f7fafc;
      border-radius: 8px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #c6f6d5;
      color: #22543d;
      border-left: 4px solid #38a169;
    }

    .alert-error {
      background: #fed7d7;
      color: #742a2a;
      border-left: 4px solid #e53e3e;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #a0aec0;
    }

    .empty-state h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 16px;
    }
  
    .btn-delete {
      background: #dc3545;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-delete:hover {
      background: #c82333;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎫 Support Ticket System</h1>
      <button class="btn" onclick="openNewTicketModal()">+ New Ticket</button>
    </div>

    <div class="content">
      <div class="filters">
        <div class="filter-group">
          <label>Status</label>
          <select id="statusFilter" onchange="loadTickets()">
            <option value="">All Statuses</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
          </select>
        
        </div>
      </div>

      <div id="alert" class="alert"></div>
      <div id="ticketsList" class="tickets-list">
        <div class="loading">Loading tickets...</div>
      </div>
    </div>
  </div>

  <!-- New Ticket Modal -->
  <div id="newTicketModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Ticket</h2>
        <button class="close-btn" onclick="closeNewTicketModal()">&times;</button>
      </div>
      <form id="newTicketForm" onsubmit="createTicket(event)">
        <div class="form-group">
          <label for="ticketTitle">Title</label>
          <input type="text" id="ticketTitle" required>
        </div>
        <div class="form-group">
          <label for="ticketMessage">Description</label>
          <textarea id="ticketMessage" required></textarea>
        </div>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeNewTicketModal()">Cancel</button>
          <button type="submit" class="btn">Create Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Ticket Modal -->
  <div id="viewTicketModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="viewTicketTitle"></h2>
          <div id="viewTicketMeta" style="color: #718096; font-size: 14px; margin-top: 4px;"></div>
        </div>
        <button class="close-btn" onclick="closeViewTicketModal()">&times;</button>
      </div>

      <div class="status-controls">
        <label style="margin: 0; align-self: center;">Status:</label>
        <button class="btn btn-secondary" onclick="updateStatus('open')">Open</button>
        <button class="btn btn-secondary" onclick="updateStatus('in_progress')">In Progress</button>
        <button class="btn btn-secondary" onclick="updateStatus('resolved')">Resolved</button>
        <button class="btn btn-secondary" onclick="updateStatus('closed')">Closed</button>
      </div>

      <div style="margin-top: 15px; text-align: right;">
        <button class="btn-delete" onclick="openDeleteConfirmModal()">Delete Ticket</button>
      </div>

      <div id="messagesContainer" class="messages-container"></div>

      <form id="addMessageForm" onsubmit="addMessage(event)">
        <div class="form-group">
          <label for="newMessage">Add a Message</label>
          <textarea id="newMessage" required placeholder="Type your message here..."></textarea>
        </div>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </div>

  <script>
    let currentTicketId = null;

    function showAlert(message, type = 'success') {
      const alert = document.getElementById('alert');
      alert.className = `alert alert-${type} show`;
      alert.textContent = message;
      setTimeout(() => {
        alert.className = 'alert';
      }, 5000);
    }

    async function loadTickets() {
      const status = document.getElementById('statusFilter').value;
      const params = status ? `?status=${status}` : '';

      try {
        const resp = await fetch(`/tickets${params}`);
        const tickets = await resp.json();

        const container = document.getElementById('ticketsList');
        
        if (tickets.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h3>No tickets found</h3>
              <p>Create a new ticket to get started</p>
            </div>
          `;
          return;
        }

        container.innerHTML = tickets.map(ticket => `
          <div class="ticket-card" onclick="viewTicket(${ticket.ticket_id})">
            <div class="ticket-header">
              <div>
                <div class="ticket-title">${ticket.title}</div>
                <div class="ticket-meta">
                  Created by ${ticket.created_by} • ${new Date(ticket.created_at).toLocaleString()}
                  • ${ticket.message_count} message${ticket.message_count !== 1 ? 's' : ''}
                </div>
              </div>
              <span class="status-badge status-${ticket.status}">${ticket.status.replace('_', ' ')}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showAlert('Failed to load tickets: ' + err, 'error');
      }
    }

    function openNewTicketModal() {
      document.getElementById('newTicketModal').style.display = 'block';
    }

    function closeNewTicketModal() {
      document.getElementById('newTicketModal').style.display = 'none';
      document.getElementById('newTicketForm').reset();
    }

    async function createTicket(event) {
      event.preventDefault();

      const title = document.getElementById('ticketTitle').value;
      const message = document.getElementById('ticketMessage').value;

      try {
        const resp = await fetch('/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, initial_message: message })
        });

        if (!resp.ok) {
          const data = await resp.json();
          throw new Error(data.error || 'Failed to create ticket');
        }

        showAlert('Ticket created successfully!');
        closeNewTicketModal();
        loadTickets();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function viewTicket(ticketId) {
      currentTicketId = ticketId;

      try {
        const resp = await fetch(`/tickets/${ticketId}`);
        const ticket = await resp.json();

        document.getElementById('viewTicketTitle').textContent = ticket.title;
        document.getElementById('viewTicketMeta').innerHTML = `
          <span class="status-badge status-${ticket.status}">${ticket.status.replace('_', ' ')}</span>
          • Created by ${ticket.created_by} • ${new Date(ticket.created_at).toLocaleString()}
        `;

        const messagesContainer = document.getElementById('messagesContainer');
        messagesContainer.innerHTML = ticket.messages.map(msg => `
          <div class="message">
            <div class="message-author">${msg.author}</div>
            <div class="message-time">${new Date(msg.created_at).toLocaleString()}</div>
            <div class="message-text">${msg.message_text}</div>
          </div>
        `).join('');

        document.getElementById('viewTicketModal').style.display = 'block';
      } catch (err) {
        showAlert('Failed to load ticket: ' + err, 'error');
      }
    }

    function closeViewTicketModal() {
      document.getElementById('viewTicketModal').style.display = 'none';
      document.getElementById('addMessageForm').reset();
      currentTicketId = null;
    }

    async function updateStatus(status) {
      if (!currentTicketId) return;

      try {
        const resp = await fetch(`/tickets/${currentTicketId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });

        if (!resp.ok) {
          const data = await resp.json();
          throw new Error(data.error || 'Failed to update status');
        }

        showAlert('Status updated successfully!');
        viewTicket(currentTicketId); // Reload ticket
        loadTickets(); // Refresh list
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function addMessage(event) {
      event.preventDefault();
      if (!currentTicketId) return;

      const messageText = document.getElementById('newMessage').value;

      try {
        const resp = await fetch(`/tickets/${currentTicketId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message_text: messageText })
        });

        if (!resp.ok) {
          const data = await resp.json();
          throw new Error(data.error || 'Failed to add message');
        }

        document.getElementById('newMessage').value = '';
        showAlert('Message added successfully!');
        viewTicket(currentTicketId); // Reload ticket
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    // Close modals when clicking outside
    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
      }
    }

    // Load tickets on page load
    loadTickets();
  

    // Delete ticket functionality
    let ticketToDelete = null;

    function openDeleteConfirmModal() {
      if (!currentTicketId) return;
      ticketToDelete = currentTicketId;
      document.getElementById('deleteConfirmModal').style.display = 'block';
    }

    function closeDeleteConfirmModal() {
      document.getElementById('deleteConfirmModal').style.display = 'none';
      ticketToDelete = null;
    }

    async function confirmDelete() {
      if (!ticketToDelete) return;

      try {
        const resp = await fetch(`/tickets/${ticketToDelete}`, {
          method: 'DELETE'
        });

        if (!resp.ok) {
          const data = await resp.json();
          throw new Error(data.error || 'Failed to delete ticket');
        }

        showAlert('Ticket deleted successfully!');
        closeDeleteConfirmModal();
        closeViewTicketModal();
        loadTickets(); // Refresh ticket list
      } catch (err) {
        showAlert(err.message, 'error');
        closeDeleteConfirmModal();
      }
    }

  </script>

  <!-- Delete Confirmation Modal -->
  <div id="deleteConfirmModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <h2>Confirm Delete</h2>
      <p style="margin: 20px 0;">Are you sure you want to delete this ticket? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-delete" onclick="confirmDelete()">Yes, Delete</button>
        <button class="btn" onclick="closeDeleteConfirmModal()">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
