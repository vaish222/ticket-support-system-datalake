command:
  - "python"
  - "app.py"

resources:
  - name: lakebase-endpoint
    description: Lakebase endpoint for ticket system database
    postgres:
      name: projects/ticket-support-system/branches/production/endpoints/primary
      permission: ALL

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"